name: Request a client
description: A mail client you would like measured. (Better still, add it — see CONTRIBUTING.md.)
labels: [client]
body:
  - type: input
    id: name
    attributes:
      label: Client
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Where to get it
  - type: dropdown
    id: imap
    attributes:
      label: Can it be pointed at an arbitrary IMAP server?
      description: Clients that only talk to one provider's API cannot be measured like-for-like.
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Settings it needs to keep the whole mailbox locally, quirks of its window, whether you could maintain its definition.
