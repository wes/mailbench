# mailben.ch. TLS ends at the jokku edge; this sees plain HTTP.

# Vite names /assets/ files by their content, so they never change. Everything
# else (pages, and the RSC payloads fetched on client-side navigation) is
# revalidated, so a deploy shows up at once.
map $uri $mailbench_cache {
  ~^/assets/  "public, max-age=31536000, immutable";
  default     "public, max-age=0, must-revalidate";
}

server {
  listen 80 default_server;
  root /usr/share/nginx/html;
  index index.html;

  # Redirects stay relative, so they keep whatever scheme and host the edge
  # was asked for.
  absolute_redirect off;
  server_tokens off;

  if ($host = www.mailben.ch) {
    return 301 https://mailben.ch$request_uri;
  }

  # Pages are canonical without a trailing slash, as Waku links them.
  rewrite ^(.+)/$ $1 permanent;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Set here and nowhere else: a location with an add_header of its own would
  # silently drop all of these.
  add_header Cache-Control $mailbench_cache always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
