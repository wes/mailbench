# Dovecot, configured for one thing: serving the benchmark corpus to every
# client under test over plain IMAP on localhost.
#
# Nothing here is a suggestion for a real server. Authentication is a plaintext
# password in a file, TLS is off, and the whole thing listens on a loopback
# port — all of which is fine for a container holding invented mail and would
# be negligent for anything else.

protocols = imap
listen = *

# The container runs as root and the mail is owned by the mounted volume's
# uid; `mail_uid`/`mail_gid` are set from the environment by compose so the
# same Maildir works whoever generated it.
mail_location = maildir:/srv/mail
mail_uid = 1000
mail_gid = 1000

# The clients under test are on the host. Plaintext auth over a loopback
# port is what keeps five different account-setup dialogs from each needing a
# certificate trusted first.
disable_plaintext_auth = no
ssl = no
auth_mechanisms = plain login

passdb {
  driver = passwd-file
  args = /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = /etc/dovecot/users
  default_fields = uid=1000 gid=1000 home=/srv/mail
}

namespace inbox {
  inbox = yes
  separator = /
  # Maildir++ on disk, `/` on the wire: the corpus writes `.Lists.rust` and
  # the clients see `Lists/rust`, which is the nesting a real server hands
  # back and the one Spool reads its delimiter from.
  prefix =
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  # A benchmark run opens far more simultaneous connections than a person
  # does — several clients syncing at once, each with its own IDLE session.
  service_count = 0
  process_min_avail = 4
}

# Indexing a quarter of a million messages is work the server does once. It is
# done deliberately with `doveadm index` before a run (see `bench/README.md`)
# so that no client's first sync is secretly paying for it and reporting it as
# its own slowness.
protocol imap {
  mail_max_userip_connections = 50
}

mail_plugins = $mail_plugins

log_path = /dev/stderr
info_log_path = /dev/stderr
