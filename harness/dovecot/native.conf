# Dovecot 2.4, run natively as the current user — no Docker, no root.
#
# The same server as `dovecot.conf` (the container's, 2.3 syntax), translated
# for Homebrew's 2.4. Native is the preferred path on a Mac: a container on
# macOS is a Linux VM, and serving 50,000 small files across the VM's file
# sharing puts a hypervisor between every client and every message.
#
# A template: `harness/server.sh` fills in the @PLACEHOLDERS@ and writes the
# result to ~/mailbench/server-<corpus>/dovecot.conf. Do not point dovecot at
# this file directly.
#
# Nothing here is a suggestion for a real server. Plaintext passwords, no TLS,
# loopback only — fine for invented mail and negligent for anything else.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
# Loopback only, on a port of the benchmark's own so it cannot collide with
# anything real. Clients connect to 10143 (10144 for the 250k corpus); with the
# meter in front, Dovecot itself listens 1000 above that.
listen = 127.0.0.1

base_dir = @STATE@/run
state_dir = @STATE@/state
log_path = @STATE@/dovecot.log
info_log_path = @STATE@/dovecot.log

# Every process runs as whoever started it. Dovecot normally drops privileges
# into dedicated users; there is nothing to drop from here.
default_internal_user = @USER@
default_internal_group = @GROUP@
default_login_user = @USER@
first_valid_uid = 1

# Every service sets RLIMIT_DATA at startup, and macOS on Apple silicon refuses
# both Dovecot's 256M default (EINVAL: processes already map more than that)
# and "unlimited" (EPERM: Dovecot passes 2^64-1, above macOS's RLIM_INFINITY).
# Anything from about 1T up is accepted, and is no limit in practice.
default_vsz_limit = 1T

auth_allow_cleartext = yes
auth_mechanisms = plain login
ssl = no

passdb passwd-file {
  passwd_file_path = @STATE@/users
}

userdb static {
  fields {
    uid = @UID@
    gid = @GID@
    home = @MAILDIR@
  }
}

mail_driver = maildir
mail_path = @MAILDIR@
# Indexes beside the server's state, not inside the corpus, so the Maildir
# stays what generate_corpus.py wrote. (Dovecot still keeps its uidlist in each
# folder, and renames a file when a client changes its flags; the corpus
# digest ignores both.)
mail_index_path = @STATE@/index

namespace inbox {
  inbox = yes
  # Maildir++ on disk, `/` on the wire: the corpus writes `.Lists.rust` and
  # the clients see `Lists/rust`.
  separator = /
  prefix =
}

service imap-login {
  chroot =
  inet_listener imap {
    port = @PORT@
  }
  # Several clients syncing at once, each with its own IDLE sessions.
  restart_request_count = unlimited
  process_min_avail = 4
}

service anvil {
  chroot =
}

service auth {
  # Not root, so the default 0600 root-owned socket cannot be created.
  unix_listener auth-userdb {
    user = @USER@
  }
}

protocol imap {
  mail_max_userip_connections = 50
}
